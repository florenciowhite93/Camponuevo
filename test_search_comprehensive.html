<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Búsqueda Completo</title>
    <link rel="icon" type="image/svg+xml" href="img/Asset 7.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2d5a27',
                        dark: '#1b5e20'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Header placeholder -->
    <div id="site-header-placeholder"></div>
    
    <!-- Content -->
    <div class="container mx-auto p-8">
        <h1 class="text-2xl font-bold mb-4">Test de Búsqueda Completo</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">Instrucciones:</h2>
            <ol class="list-decimal list-inside space-y-2">
                <li>Abre la consola del navegador (F12)</li>
                <li>Haz hover sobre el ícono de búsqueda en el header</li>
                <li>Escribe una búsqueda en el input</li>
                <li>Verifica los logs en la consola</li>
            </ol>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Productos disponibles (primeros 10):</h2>
            <div id="productList" class="grid grid-cols-2 gap-2 text-sm"></div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="components/header_content.js"></script>
    <script src="js/data.js"></script>
    <script src="js/header.js"></script>
    
    <script>
        // Verificar que getProducts está disponible
        console.log('getProducts function:', typeof getProducts);
        
        // Mostrar productos disponibles
        if (typeof getProducts === 'function') {
            const products = getProducts();
            console.log('Total products:', products.length);
            
            const productList = document.getElementById('productList');
            if (products.length > 0) {
                productList.innerHTML = products.slice(0, 10).map(p => 
                    `<div class="p-2 bg-gray-50 rounded">${p.title} - ${p.laboratory || 'Varios'}</div>`
                ).join('');
            } else {
                productList.innerHTML = '<p class="text-red-500">No hay productos disponibles</p>';
            }
        }
    </script>
</body>
</html>
