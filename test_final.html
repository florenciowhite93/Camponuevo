<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Final del Sistema de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background-color: #d4edda; color: #155724; }
        .fail { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Final del Sistema de Usuarios</h1>
    <div id="results"></div>
    
    <script src="js/data.js"></script>
    <script>
        const results = document.getElementById('results');
        
        async function runTests() {
            let html = '';
            
            // Test 1: Verify user functions exist
            const userFunctions = ['registerUser', 'loginUser', 'logoutUser', 'getCurrentUser', 'updateUserProfile', 'changePassword'];
            let allExist = true;
            userFunctions.forEach(fn => {
                if (typeof window[fn] !== 'function') {
                    html += `<div class="test fail">✗ Función ${fn} no existe</div>`;
                    allExist = false;
                }
            });
            if (allExist) {
                html += `<div class="test pass">✓ Todas las funciones de usuario existen</div>`;
            }
            
            // Test 2: Verify security functions exist
            const securityFunctions = ['getSecurityQuestion', 'validateSecurityAnswer', 'resetPasswordWithSecurity'];
            allExist = true;
            securityFunctions.forEach(fn => {
                if (typeof window[fn] !== 'function') {
                    html += `<div class="test fail">✗ Función ${fn} no existe</div>`;
                    allExist = false;
                }
            });
            if (allExist) {
                html += `<div class="test pass">✓ Todas las funciones de seguridad existen</div>`;
            }
            
            // Test 3: Register a test user
            const registerResult = await registerUser({
                name: "Usuario Test Final",
                email: "testfinal@example.com",
                password: "test123"
            });
            
            if (registerResult.success) {
                html += `<div class="test pass">✓ Registro exitoso (usuario: ${registerResult.user.email})</div>`;
                
                // Test 4: Update profile with new fields
                const updateResult = await updateUserProfile(registerResult.user.id, {
                    phone: "+54 11 1234-5678",
                    location: "Establecimiento Test",
                    identification: "20-12345678-9"
                });
                
                if (updateResult.success) {
                    html += `<div class="test pass">✓ Perfil actualizado con nuevos campos</div>`;
                    
                    // Test 5: Set security question
                    const securityResult = await updateUserProfile(registerResult.user.id, {
                        securityQuestion: "¿Nombre de tu primera mascota?",
                        securityAnswer: "Firulais"
                    });
                    
                    if (securityResult.success) {
                        html += `<div class="test pass">✓ Pregunta de seguridad configurada</div>`;
                        
                        // Test 6: Verify security question retrieval
                        const questionResult = getSecurityQuestion("testfinal@example.com");
                        if (questionResult.success) {
                            html += `<div class="test pass">✓ Pregunta de seguridad recuperada: "${questionResult.question}"</div>`;
                            
                            // Test 7: Validate security answer
                            const answerResult = await validateSecurityAnswer("testfinal@example.com", "Firulais");
                            if (answerResult.success) {
                                html += `<div class="test pass">✓ Respuesta de seguridad validada</div>`;
                            } else {
                                html += `<div class="test fail">✗ Falló validación de respuesta: ${answerResult.message}</div>`;
                            }
                        } else {
                            html += `<div class="test fail">✗ Falló recuperación de pregunta: ${questionResult.message}</div>`;
                        }
                    } else {
                        html += `<div class="test fail">✗ Falló configuración de seguridad: ${securityResult.message}</div>`;
                    }
                } else {
                    html += `<div class="test fail">✗ Falló actualización de perfil: ${updateResult.message}</div>`;
                }
            } else {
                html += `<div class="test fail">✗ Falló registro: ${registerResult.message}</div>`;
            }
            
            // Test 8: Verify order functions
            const orderFunctions = ['saveOrder', 'getOrdersByUser'];
            allExist = true;
            orderFunctions.forEach(fn => {
                if (typeof window[fn] !== 'function') {
                    html += `<div class="test fail">✗ Función ${fn} no existe</div>`;
                    allExist = false;
                }
            });
            if (allExist) {
                html += `<div class="test pass">✓ Todas las funciones de pedidos existen</div>`;
            }
            
            results.innerHTML = html;
        }
        
        runTests();
    </script>
</body>
</html>
